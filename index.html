<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuestionario de Exploración Profesional · Foro de Empleo UFV</title>
<style>
  :root {
    --bg: #F1F5F9;
    --surface: #FFFFFF;
    --surface-2: #F8FAFC;
    --ink: #1A202C;
    --muted: #5B6676;
    --line: #CBD5E0;
    --navy: #002B49;
    --navy-ink: #FFFFFF;
    --burg: #8A0027;
    --burg-ink: #FFFFFF;
    --ok: #2F855A;
    --info-bg: #EBF8FF;
    --info-line: #3182CE;
    --info-ink: #2B6CB0;
    --focus: #3182CE;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E1620; --surface: #17222F; --surface-2: #1D2B3B; --ink: #E8EEF5; --muted: #9AA9BA;
      --line: #36485C; --navy: #0B3A5E; --burg: #B3123F; --ok: #68D391;
      --info-bg: #14283B; --info-line: #4299E1; --info-ink: #90CDF4; --focus: #63B3ED;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1620; --surface: #17222F; --surface-2: #1D2B3B; --ink: #E8EEF5; --muted: #9AA9BA;
    --line: #36485C; --navy: #0B3A5E; --burg: #B3123F; --ok: #68D391;
    --info-bg: #14283B; --info-line: #4299E1; --info-ink: #90CDF4; --focus: #63B3ED;
    color-scheme: dark;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.55;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 0 0 40px; }

  header.hero {
    background: linear-gradient(135deg, #002B49 0%, #001A2C 100%); color: #fff;
    padding: 26px 22px 22px; border-bottom: 5px solid var(--burg);
  }
  .tag {
    display: inline-block; background: #8A0027; color: #fff; font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 1.3px; padding: 4px 10px; border-radius: 4px; margin-bottom: 10px;
  }
  header.hero h1 { margin: 0; font-size: clamp(21px, 5vw, 28px); line-height: 1.2; }
  header.hero p { margin: 8px 0 0; color: #D0E1ED; font-size: 14.5px; font-weight: 300; }

  .bar {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    background: var(--surface); border-bottom: 1px solid var(--line); padding: 10px 14px 8px;
  }
  .progress-row { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
  .track { flex: 1; height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--burg), #D0436A); border-radius: 99px; transition: width .3s; }
  .steps { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
  .step {
    flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted);
    border-radius: 99px; padding: 6px 12px; font-size: 13px; font-family: inherit; cursor: pointer; white-space: nowrap;
    min-height: 36px;
  }
  .step.on { background: var(--navy); color: var(--navy-ink); border-color: var(--navy); font-weight: 600; }
  .step.done::after { content: " ✓"; color: var(--ok); font-weight: 700; }
  .step.on.done::after { color: #9AE6B4; }

  main { padding: 18px 14px 0; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px 18px; }
  .block-tag {
    display: inline-block; background: var(--burg); color: var(--burg-ink); font-weight: 700; font-size: 12.5px;
    padding: 3px 10px; border-radius: 6px; margin-bottom: 8px;
  }
  h2 { margin: 0 0 6px; font-size: 20px; color: var(--ink); line-height: 1.25; }
  .lead { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
  .info {
    background: var(--info-bg); border-left: 4px solid var(--info-line); color: var(--info-ink);
    border-radius: 0 8px 8px 0; padding: 12px 14px; font-size: 13.5px; margin: 14px 0;
  }

  .f { display: block; margin-bottom: 18px; }
  .l { display: block; font-weight: 600; font-size: 14.5px; margin-bottom: 2px; }
  .h { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  input[type="text"], input[type="date"], textarea {
    width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--surface-2);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
  }
  textarea { min-height: 110px; resize: vertical; }
  input:focus, textarea:focus, button:focus-visible, .chip:focus-within {
    outline: 3px solid var(--focus); outline-offset: 1px; border-color: var(--focus);
  }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface-2);
    border-radius: 99px; padding: 8px 14px; font-size: 14px; cursor: pointer; min-height: 40px;
  }
  .chip input { width: 18px; height: 18px; accent-color: var(--burg); margin: 0; }
  .chip.sel { border-color: var(--burg); background: color-mix(in srgb, var(--burg) 10%, var(--surface)); font-weight: 600; }

  .entity-banner {
    margin: -20px -18px 18px; padding: 12px 18px; background: var(--navy); color: var(--navy-ink);
    border-radius: 11px 11px 0 0; font-weight: 600; font-size: 15px;
  }

  .photo-drop {
    border: 2px dashed var(--line); background: var(--surface-2); border-radius: 10px; padding: 18px;
    text-align: center; color: var(--muted); font-size: 14px;
  }
  .photo-drop img { max-width: 100%; max-height: 320px; border-radius: 8px; display: block; margin: 0 auto 12px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

  .btn {
    font: inherit; font-size: 15px; font-weight: 600; border-radius: 10px; padding: 11px 18px; min-height: 44px;
    border: 1px solid var(--navy); background: var(--navy); color: var(--navy-ink); cursor: pointer;
  }
  .btn.sec { background: transparent; color: var(--ink); border-color: var(--line); }
  .btn.big { background: var(--burg); border-color: var(--burg); color: var(--burg-ink); font-size: 16px; padding: 14px 22px; width: 100%; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; }
  .nav .btn { flex: 1; }

  .review-list { list-style: none; margin: 0 0 18px; padding: 0; }
  .review-list li {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14.5px;
  }
  .badge { font-size: 12.5px; font-weight: 700; padding: 3px 10px; border-radius: 99px; white-space: nowrap; }
  .badge.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
  .badge.no { background: color-mix(in srgb, var(--burg) 16%, transparent); color: var(--burg); }
  .link { background: none; border: 0; padding: 0; font: inherit; color: var(--info-ink); text-decoration: underline; cursor: pointer; text-align: left; }
  .msg { margin-top: 12px; font-size: 14px; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); }
  .saved { font-size: 12px; color: var(--muted); text-align: center; margin-top: 14px; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 18px 14px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <span class="tag">Prácticas Externas · Protagoniza Tu Futuro</span>
    <h1>Cuestionario de Exploración Profesional</h1>
    <p>Registro de campo y análisis crítico — Foro de Empleo UFV</p>
  </header>

  <div class="bar">
    <div class="progress-row">
      <div class="track" aria-hidden="true"><div class="fill" id="fill"></div></div>
      <span id="pct">0 %</span>
    </div>
    <nav class="steps" id="steps" aria-label="Pasos del cuestionario"></nav>
  </div>

  <main id="main"></main>
  <footer>Facultad de Ciencias de la Salud · Universidad Francisco de Vitoria — Madrid</footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function () {
  "use strict";

  var KEY = "ufv-foro-empleo-v1";
  var AREAS = [
    "Clínica y Salud (PGS)",
    "Educativa / Orientación",
    "RRHH / Organizaciones",
    "Social / Tercer Sector",
    "Otras (Jurídica, Deporte…)"
  ];

  function fresh() {
    return {
      nombre: "", grado: "", fecha: "",
      ent: [0, 1, 2].map(function () { return { nombre: "", areas: [], rol: "", req: "", nov: "" }; }),
      q4: "", q5: "", q6: "", q7: "",
      img: "", imgW: 0, imgH: 0
    };
  }

  var S = fresh();
  var step = 0;
  var downloads = null;
  var lastSaved = "";

  // ---------- persistencia ----------
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var d = JSON.parse(raw);
        var base = fresh();
        for (var k in base) { if (d[k] !== undefined) base[k] = d[k]; }
        if (!Array.isArray(base.ent) || base.ent.length !== 3) base.ent = fresh().ent;
        S = base;
      }
      var im = localStorage.getItem(KEY + "-img");
      if (im) { var o = JSON.parse(im); S.img = o.d || ""; S.imgW = o.w || 0; S.imgH = o.h || 0; }
    } catch (e) { /* almacenamiento no disponible */ }
  }
  var saveTimer = null;
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try {
        var copy = JSON.parse(JSON.stringify(S));
        copy.img = ""; copy.imgW = 0; copy.imgH = 0;
        localStorage.setItem(KEY, JSON.stringify(copy));
        if (S.img) localStorage.setItem(KEY + "-img", JSON.stringify({ d: S.img, w: S.imgW, h: S.imgH }));
        else localStorage.removeItem(KEY + "-img");
        lastSaved = new Date().toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
      } catch (e) { lastSaved = ""; }
      var el = document.getElementById("savedinfo");
      if (el) el.textContent = lastSaved ? "Guardado automáticamente a las " + lastSaved : "";
    }, 350);
  }

  // ---------- utilidades ----------
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function getP(path) {
    return path.split(".").reduce(function (o, k) { return o == null ? o : o[k]; }, S);
  }
  function setP(path, val) {
    var parts = path.split("."), o = S;
    for (var i = 0; i < parts.length - 1; i++) o = o[parts[i]];
    o[parts[parts.length - 1]] = val;
  }
  function filled(v) { return String(v || "").trim().length > 0; }

  // ---------- pasos ----------
  var STEPS = [
    { t: "Tus datos" },
    { t: "Entidad 1" },
    { t: "Entidad 2" },
    { t: "Entidad 3" },
    { t: "Análisis" },
    { t: "Plan y foto" },
    { t: "Descargar" }
  ];

  function stepStatus(i) {
    var d = 0, n = 0;
    function chk(v) { n++; if (filled(v)) d++; }
    if (i === 0) { chk(S.nombre); chk(S.grado); chk(S.fecha); }
    else if (i >= 1 && i <= 3) {
      var e = S.ent[i - 1];
      chk(e.nombre); n++; if (e.areas.length) d++; chk(e.rol); chk(e.req); chk(e.nov);
    }
    else if (i === 4) { chk(S.q4); chk(S.q5); chk(S.q6); }
    else if (i === 5) { chk(S.q7); chk(S.img); }
    else return null;
    return { d: d, n: n };
  }
  function overall() {
    var d = 0, n = 0;
    for (var i = 0; i <= 5; i++) { var s = stepStatus(i); d += s.d; n += s.n; }
    return { d: d, n: n, pct: Math.round(100 * d / n) };
  }

  // ---------- componentes ----------
  function textField(label, hint, path, ph) {
    return '<label class="f"><span class="l">' + esc(label) + '</span>' +
      (hint ? '<span class="h">' + esc(hint) + '</span>' : '') +
      '<input type="text" data-p="' + path + '" value="' + esc(getP(path)) + '" placeholder="' + esc(ph || "") + '" autocomplete="off"></label>';
  }
  function areaField(label, hint, path, ph, rows) {
    return '<label class="f"><span class="l">' + esc(label) + '</span>' +
      (hint ? '<span class="h">' + esc(hint) + '</span>' : '') +
      '<textarea data-p="' + path + '" rows="' + (rows || 4) + '" placeholder="' + esc(ph || "") + '">' + esc(getP(path)) + '</textarea></label>';
  }

  function viewDatos() {
    return '<div class="card">' +
      '<span class="block-tag">Inicio</span><h2>Objetivo de la actividad</h2>' +
      '<p class="lead">Esta actividad sustituye la sesión presencial sobre salidas profesionales. Durante tu visita al <strong>Foro de Empleo UFV</strong>, explora de primera mano las salidas laborales del graduado en Psicología hablando con al menos <strong>3 entidades, centros o empresas</strong> donde esté presente la figura del psicólogo.</p>' +
      '<div class="info"><strong>📌 Cómo funciona:</strong> rellena cada paso desde el móvil mientras estás en los stands. Se guarda solo. Al final descargas tu entrega en PDF y la subes a la tarea de Canvas.</div>' +
      '<h2 style="margin-top:22px">👤 Datos del estudiante</h2><p class="lead"></p>' +
      textField("Nombre y apellidos", "", "nombre", "Nombre y apellidos") +
      textField("Grado / titulación", "", "grado", "Ej.: Grado en Psicología") +
      '<label class="f"><span class="l">Fecha de asistencia</span><input type="date" data-p="fecha" value="' + esc(S.fecha) + '"></label>' +
      '</div>';
  }

  function viewEntidad(i) {
    var e = S.ent[i], n = i + 1, p = "ent." + i + ".";
    var chips = AREAS.map(function (a, k) {
      var on = e.areas.indexOf(a) >= 0;
      return '<label class="chip' + (on ? " sel" : "") + '"><input type="checkbox" data-area="' + i + ':' + k + '"' + (on ? " checked" : "") + '> ' + esc(a) + '</label>';
    }).join("");
    return '<div class="card"><div class="entity-banner">🏢 Entidad ' + n + ' de 3</div>' +
      '<span class="block-tag">Bloque 1</span><h2>Mapeo de entidades y salidas profesionales</h2>' +
      '<p class="lead">Indaga e interactúa en el stand de una organización donde trabaje o se requiera la figura del psicólogo.</p>' +
      textField(n + ".1. Nombre del centro / empresa / organización", "", p + "nombre", "Nombre de la entidad") +
      '<div class="f"><span class="l">' + n + '.2. Área principal de la Psicología representada</span><span class="h">Puedes marcar más de una.</span><div class="chips">' + chips + '</div></div>' +
      areaField(n + ".3. Rol y funciones principales del psicólogo en esta entidad", "", p + "rol", "¿Qué hace el psicólogo en el día a día?") +
      areaField(n + ".4. Requisitos de acceso y competencias clave demandadas", "Formación, idiomas, soft skills…", p + "req", "") +
      areaField(n + ".5. Aspecto más novedoso o relevante aprendido", "Tras hablar con los profesionales del stand.", p + "nov", "") +
      '</div>';
  }

  function viewAnalisis() {
    return '<div class="card"><span class="block-tag">Bloque 2</span><h2>Análisis crítico y autoevaluación</h2><p class="lead">Con la información que has recopilado en los tres stands.</p>' +
      areaField("4. Diversificación del perfil profesional", "¿Qué diferencias principales observas entre las funciones del psicólogo en el ámbito sanitario/educativo respecto al ámbito empresarial u organizacional?", "q4", "", 6) +
      areaField("5. Análisis de brecha y competencias", "Comparando tu perfil actual con las exigencias planteadas por los profesionales en el Foro, ¿qué conocimientos, habilidades blandas o posgrados consideras que necesitas reforzar?", "q5", "", 6) +
      areaField("6. Conexión con tu proyecto formativo «Protagoniza Tu Futuro»", "¿Cuál de las salidas exploradas encaja mejor con tus metas para tus Prácticas Externas y tu desarrollo profesional futuro? Justifica tu respuesta.", "q6", "", 6) +
      '</div>';
  }

  function viewPlan() {
    var photo = S.img
      ? '<img src="' + S.img + '" alt="Evidencia del paso por el Foro"><div class="row"><label class="btn sec" style="display:inline-flex;align-items:center">Cambiar foto<input type="file" accept="image/*" id="file" hidden></label><button class="btn sec" id="rmimg" type="button">Quitar</button></div>'
      : '<p style="margin:0 0 12px">📷 Foto en un stand, acreditación de asistencia o tarjetas de contacto / folletos</p><label class="btn" style="display:inline-flex;align-items:center">Hacer o elegir foto<input type="file" accept="image/*" id="file" hidden></label>';
    return '<div class="card"><span class="block-tag">Bloque 3</span><h2>Plan de acción y evidencias</h2><p class="lead"></p>' +
      areaField("7. Siguiente paso / plan de networking", "¿Qué acción concreta realizarás en los próximos días a raíz de tu visita? (Ej.: conectar por LinkedIn con un responsable de selección, adaptar tu CV para una entidad del foro, consultar programas de posgrado…)", "q7", "", 5) +
      '<div class="f"><span class="l">8. Evidencia gráfica de paso por el Foro</span><span class="h">Adjunta una fotografía realizada en alguno de los stands visitados, tu acreditación de asistencia o una foto de las tarjetas de contacto/folletos obtenidos.</span>' +
      '<div class="photo-drop" id="photoBox">' + photo + '</div><div id="imgmsg" class="h" style="margin-top:8px"></div></div></div>';
  }

  function viewRevisar() {
    var items = [];
    for (var i = 0; i <= 5; i++) {
      var s = stepStatus(i), ok = s.d === s.n;
      items.push('<li><span><button type="button" class="link" data-go="' + i + '">' + esc(STEPS[i].t) + '</button></span><span class="badge ' + (ok ? "ok" : "no") + '">' + (ok ? "Completo" : (s.n - s.d) + " pendiente" + (s.n - s.d > 1 ? "s" : "")) + '</span></li>');
    }
    var o = overall();
    var canDl = true;
    return '<div class="card"><span class="block-tag">Entrega</span><h2>Revisa y descarga tu entrega</h2>' +
      '<p class="lead">' + (o.pct === 100 ? "Todo está completo. Descarga el PDF y súbelo a la tarea de Canvas." : "Puedes descargar ahora, pero revisa lo que falta antes de subirlo a Canvas.") + '</p>' +
      '<ul class="review-list">' + items.join("") + '</ul>' +
      '<button type="button" class="btn big" id="dl">⬇ Descargar mi entrega (PDF)</button>' +
      '<div id="dlmsg" class="msg" hidden></div>' +
      (canDl ? "" : '<div class="msg">La descarga directa no está disponible en este navegador. Usa «Copiar mis respuestas» y pégalas en un documento para subir a Canvas.<div style="margin-top:10px"><button type="button" class="btn sec" id="copy">Copiar mis respuestas</button></div></div>') +
      '<div class="info" style="margin-top:18px"><strong>Siguiente paso:</strong> entra en la tarea de Canvas y sube el archivo PDF descargado.</div>' +
      '</div>';
  }

  // ---------- render ----------
  function renderBar() {
    var o = overall();
    document.getElementById("fill").style.width = o.pct + "%";
    document.getElementById("pct").textContent = o.pct + " %";
    var html = STEPS.map(function (s, i) {
      var st = stepStatus(i), done = st && st.d === st.n;
      return '<button type="button" class="step' + (i === step ? " on" : "") + (done ? " done" : "") + '" data-go="' + i + '">' + (i + 1) + ". " + esc(s.t) + '</button>';
    }).join("");
    var cont = document.getElementById("steps");
    var sl = cont.scrollLeft;
    cont.innerHTML = html;
    cont.scrollLeft = sl;
    var cur = cont.querySelector(".on");
    if (cur && cur.scrollIntoView) { try { cur.scrollIntoView({ inline: "center", block: "nearest" }); } catch (e) {} }
  }

  function render() {
    var v = step === 0 ? viewDatos() : step <= 3 ? viewEntidad(step - 1) : step === 4 ? viewAnalisis() : step === 5 ? viewPlan() : viewRevisar();
    var nav = '<div class="nav">' +
      (step > 0 ? '<button type="button" class="btn sec" data-go="' + (step - 1) + '">← Anterior</button>' : '<span></span>') +
      (step < STEPS.length - 1 ? '<button type="button" class="btn" data-go="' + (step + 1) + '">Siguiente →</button>' : '') +
      '</div><div class="saved" id="savedinfo">' + (lastSaved ? "Guardado automáticamente a las " + lastSaved : "Tus respuestas se guardan solas en este dispositivo.") + '</div>';
    document.getElementById("main").innerHTML = v + nav;
    renderBar();
  }

  function go(i) {
    step = Math.max(0, Math.min(STEPS.length - 1, i));
    render();
    window.scrollTo({ top: 0 });
  }

  // ---------- eventos ----------
  document.addEventListener("click", function (ev) {
    var t = ev.target.closest("[data-go]");
    if (t) { go(parseInt(t.getAttribute("data-go"), 10)); return; }
    if (ev.target.id === "dl") { exportPdf(); return; }
    if (ev.target.id === "copy") { copyText(); return; }
    if (ev.target.id === "rmimg") { S.img = ""; S.imgW = 0; S.imgH = 0; save(); render(); }
  });

  document.addEventListener("input", function (ev) {
    var el = ev.target;
    var p = el.getAttribute && el.getAttribute("data-p");
    if (p) { setP(p, el.value); save(); renderBar(); }
  });

  document.addEventListener("change", function (ev) {
    var el = ev.target;
    var a = el.getAttribute && el.getAttribute("data-area");
    if (a) {
      var parts = a.split(":"), e = S.ent[+parts[0]], name = AREAS[+parts[1]];
      var idx = e.areas.indexOf(name);
      if (el.checked && idx < 0) e.areas.push(name);
      if (!el.checked && idx >= 0) e.areas.splice(idx, 1);
      el.closest(".chip").classList.toggle("sel", el.checked);
      save(); renderBar();
      return;
    }
    if (el.id === "file" && el.files && el.files[0]) handleImage(el.files[0]);
  });

  function handleImage(file) {
    var msg = document.getElementById("imgmsg");
    if (msg) msg.textContent = "Procesando imagen…";
    var reader = new FileReader();
    reader.onerror = function () { if (msg) msg.textContent = "No se pudo leer la imagen. Prueba con otra."; };
    reader.onload = function () {
      var img = new Image();
      img.onerror = function () { if (msg) msg.textContent = "Formato de imagen no compatible. Prueba con JPG o PNG."; };
      img.onload = function () {
        var max = 1200, r = Math.min(1, max / Math.max(img.width, img.height));
        var w = Math.round(img.width * r), h = Math.round(img.height * r);
        var c = document.createElement("canvas");
        c.width = w; c.height = h;
        var ctx = c.getContext("2d");
        ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        S.img = c.toDataURL("image/jpeg", 0.8); S.imgW = w; S.imgH = h;
        save(); render();
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  // ---------- exportación ----------
  function latin(s) {
    return String(s == null ? "" : s)
      .replace(/[\u2018\u2019]/g, "'").replace(/[\u201C\u201D]/g, '"')
      .replace(/\u2026/g, "...").replace(/[\u2013\u2014]/g, "-")
      .replace(/[^\u0009\u000A\u0020-\u007E\u00A0-\u00FF]/g, "");
  }

  function fmtDate(v) {
    if (!v) return "";
    var p = v.split("-");
    return p.length === 3 ? p[2] + "/" + p[1] + "/" + p[0] : v;
  }

  function showMsg(text) {
    var m = document.getElementById("dlmsg");
    if (m) { m.hidden = false; m.textContent = text; }
  }

  function safeName(s) {
    return String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/[^A-Za-z0-9]+/g, "_").replace(/^_+|_+$/g, "").slice(0, 60);
  }

  function buildPdf() {
    var jsPDF = window.jspdf && window.jspdf.jsPDF;
    if (!jsPDF) throw new Error("jspdf");
    var doc = new jsPDF({ unit: "mm", format: "a4" });
    var W = 210, M = 18, CW = W - 2 * M, BOTTOM = 280, y = 0;

    function ensure(h) { if (y + h > BOTTOM) { doc.addPage(); y = 20; } }

    function banner(text) {
      ensure(14);
      doc.setFillColor(0, 43, 73); doc.rect(M, y, CW, 8, "F");
      doc.setTextColor(255, 255, 255); doc.setFont("helvetica", "bold"); doc.setFontSize(11);
      doc.text(latin(text), M + 3, y + 5.6);
      y += 12;
    }
    function blockTitle(text) {
      ensure(16);
      doc.setFillColor(138, 0, 39); doc.rect(M, y, 2, 7, "F");
      doc.setTextColor(0, 43, 73); doc.setFont("helvetica", "bold"); doc.setFontSize(13);
      doc.text(latin(text), M + 5, y + 5.5);
      y += 11;
    }
    function qa(label, answer) {
      doc.setFont("helvetica", "bold"); doc.setFontSize(10);
      var ql = doc.splitTextToSize(latin(label), CW);
      var empty = !filled(answer);
      doc.setFont("helvetica", empty ? "italic" : "normal"); doc.setFontSize(10.5);
      var al = doc.splitTextToSize(latin(empty ? "(sin respuesta)" : answer), CW);
      ensure(ql.length * 4.6 + Math.min(al.length, 3) * 5 + 4);
      doc.setFont("helvetica", "bold"); doc.setFontSize(10); doc.setTextColor(0, 43, 73);
      doc.text(ql, M, y + 3.5); y += ql.length * 4.6 + 1.5;
      doc.setFont("helvetica", empty ? "italic" : "normal"); doc.setFontSize(10.5);
      doc.setTextColor(empty ? 130 : 30, empty ? 130 : 30, empty ? 130 : 30);
      for (var i = 0; i < al.length; i++) { ensure(5.2); doc.text(al[i], M, y + 3.5); y += 5.2; }
      y += 3.5;
    }

    // cabecera
    doc.setFillColor(0, 43, 73); doc.rect(0, 0, W, 34, "F");
    doc.setFillColor(138, 0, 39); doc.rect(0, 34, W, 1.6, "F");
    doc.setTextColor(255, 255, 255); doc.setFont("helvetica", "bold"); doc.setFontSize(17);
    doc.text(latin("Cuestionario de Exploración Profesional"), M, 16);
    doc.setFont("helvetica", "normal"); doc.setFontSize(10.5);
    doc.text(latin("Registro de campo y análisis crítico - Foro de Empleo UFV"), M, 23);
    doc.setFontSize(9); doc.setTextColor(208, 225, 237);
    doc.text(latin("Prácticas Externas | Protagoniza Tu Futuro"), M, 29.5);
    y = 44;

    blockTitle("Datos del estudiante");
    qa("Nombre y apellidos", S.nombre);
    qa("Grado / titulación", S.grado);
    qa("Fecha de asistencia", fmtDate(S.fecha));

    blockTitle("Bloque 1 - Mapeo de entidades y salidas profesionales");
    for (var i = 0; i < 3; i++) {
      var e = S.ent[i], n = i + 1;
      banner("Entidad " + n + (filled(e.nombre) ? " - " + e.nombre : ""));
      qa(n + ".1. Nombre del centro / empresa / organización", e.nombre);
      qa(n + ".2. Área principal de la Psicología representada", e.areas.join("; "));
      qa(n + ".3. Rol y funciones principales del psicólogo en esta entidad", e.rol);
      qa(n + ".4. Requisitos de acceso y competencias clave demandadas", e.req);
      qa(n + ".5. Aspecto más novedoso o relevante aprendido", e.nov);
    }

    blockTitle("Bloque 2 - Análisis crítico y autoevaluación");
    qa("4. Diversificación del perfil profesional: diferencias entre el ámbito sanitario/educativo y el empresarial u organizacional", S.q4);
    qa("5. Análisis de brecha y competencias: qué necesito reforzar", S.q5);
    qa("6. Conexión con mi proyecto formativo «Protagoniza Tu Futuro»", S.q6);

    blockTitle("Bloque 3 - Plan de acción y evidencias");
    qa("7. Siguiente paso / plan de networking", S.q7);

    doc.setFont("helvetica", "bold"); doc.setFontSize(10); doc.setTextColor(0, 43, 73);
    var h8 = "8. Evidencia gráfica de paso por el Foro";
    if (S.img && S.imgW && S.imgH) {
      var maxW = CW, maxH = 110, r = Math.min(maxW / S.imgW, maxH / S.imgH);
      var iw = S.imgW * r, ih = S.imgH * r;
      ensure(ih + 10);
      doc.text(latin(h8), M, y + 3.5); y += 6;
      doc.addImage(S.img, "JPEG", M, y, iw, ih);
      y += ih + 4;
    } else {
      qa(h8, "");
    }

    // pie de página
    var pages = doc.getNumberOfPages();
    for (var p = 1; p <= pages; p++) {
      doc.setPage(p);
      doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor(120, 130, 140);
      doc.text(latin("Universidad Francisco de Vitoria - Facultad de Ciencias de la Salud"), M, 289);
      doc.text(p + " / " + pages, W - M, 289, { align: "right" });
    }
    return doc;
  }

  function exportPdf() {
    var btn = document.getElementById("dl");
    var doc;
    try { doc = buildPdf(); }
    catch (e) {
      showMsg(e && e.message === "jspdf"
        ? "No se pudo cargar el generador de PDF. Comprueba tu conexión y recarga la página; tus respuestas no se pierden."
        : "No se pudo generar el PDF. Inténtalo de nuevo.");
      return;
    }
    var name = "Cuestionario_Foro_Empleo_UFV" + (safeName(S.nombre) ? "_" + safeName(S.nombre) : "") + ".pdf";
    if (btn) btn.disabled = true;
    try {
      doc.save(name);
      showMsg("✅ PDF generado. Si no ves la descarga, revisa la carpeta Descargas. Después súbelo a la tarea de Canvas.");
    } catch (e) {
      showMsg("No se pudo guardar el archivo. Inténtalo de nuevo o usa otro navegador.");
    }
    // Plan B para navegadores que bloquean la descarga (p. ej. navegadores integrados de apps)
    try {
      var url = URL.createObjectURL(doc.output("blob"));
      var m = document.getElementById("dlmsg");
      if (m) {
        var a = document.createElement("a");
        a.href = url; a.download = name; a.target = "_blank"; a.rel = "noopener";
        a.textContent = "¿No se descargó? Pulsa aquí para abrir el PDF";
        a.style.cssText = "display:block;margin-top:8px;font-weight:600";
        m.appendChild(a);
      }
    } catch (e) { /* sin plan B */ }
    if (btn) btn.disabled = false;
  }

  function plainText() {
    var L = [];
    L.push("CUESTIONARIO DE EXPLORACIÓN PROFESIONAL - FORO DE EMPLEO UFV", "");
    L.push("Nombre: " + S.nombre, "Grado: " + S.grado, "Fecha: " + fmtDate(S.fecha), "");
    S.ent.forEach(function (e, i) {
      var n = i + 1;
      L.push("ENTIDAD " + n,
        n + ".1 Nombre: " + e.nombre, n + ".2 Área: " + e.areas.join("; "),
        n + ".3 Rol y funciones: " + e.rol, n + ".4 Requisitos y competencias: " + e.req,
        n + ".5 Aspecto más relevante: " + e.nov, "");
    });
    L.push("4. Diversificación del perfil: " + S.q4, "", "5. Brecha y competencias: " + S.q5, "",
      "6. Conexión con Protagoniza Tu Futuro: " + S.q6, "", "7. Plan de networking: " + S.q7);
    return L.join("\n");
  }

  function copyText() {
    var t = plainText();
    try {
      navigator.clipboard.writeText(t).then(function () { showMsg("Respuestas copiadas. Pégalas en un documento y súbelo a Canvas."); },
        function () { showMsg("No se pudo copiar automáticamente."); });
    } catch (e) { showMsg("No se pudo copiar automáticamente."); }
  }

  // ---------- inicio ----------
  load();
  render();

})();
</script>
